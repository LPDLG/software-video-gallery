<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="软件介绍视频在线播放与二维码导航">
  <title>软件介绍视频库</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <header class="site-header">
    <a class="brand" href="./" aria-label="返回首页">
      <span class="brand-mark">▶</span>
      <span>软件视频库</span>
    </a>
    <a class="github-link" href="https://github.com/LPDLG/software-video-gallery" target="_blank" rel="noreferrer">GitHub 仓库 ↗</a>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">SOFTWARE VIDEO COLLECTION</p>
      <h1>扫码即看，快速认识<br><span>常用创意软件</span></h1>
      <p class="hero-copy">每个视频均配有独立播放页面与二维码，支持电脑、手机和平板直接访问。</p>
      <div class="hero-meta">
        <span id="video-count">12 个视频</span>
        <span>全部短于 5 分钟</span>
        <span>在线播放</span>
      </div>
    </section>

    <section class="library" aria-labelledby="library-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">VIDEO LIBRARY</p>
          <h2 id="library-title">选择一个视频</h2>
        </div>
        <label class="search-box">
          <span>⌕</span>
          <input id="search" type="search" placeholder="搜索软件名称" autocomplete="off">
        </label>
      </div>
      <div id="video-grid" class="video-grid"></div>
      <p id="empty-state" class="empty-state" hidden>没有找到匹配的视频。</p>
    </section>
  </main>

  <footer>
    <span>软件介绍视频库</span>
    <span>由 GitHub Pages 提供访问</span>
  </footer>

  <script src="assets/videos.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
